name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, posix
          coverage: none
          tools: composer:v2
      # composer.lock is not committed; config.platform resolves dependencies for PHP 8.3.
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer check

  windows:
    name: PHP 8.5 on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --no-progress
      # Style and static analysis read the same code on every platform: the Linux jobs run them.
      - run: composer test
